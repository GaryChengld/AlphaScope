<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="6" fill="#0f172a"/>
  <!-- Left candle (bearish, red) -->
  <line x1="8" y1="5" x2="8" y2="9" stroke="#f87171" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="5.5" y="9" width="5" height="8" rx="1" fill="#f87171"/>
  <line x1="8" y1="17" x2="8" y2="22" stroke="#f87171" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Middle candle (bullish, green) -->
  <line x1="16" y1="4" x2="16" y2="8" stroke="#4ade80" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="13.5" y="8" width="5" height="10" rx="1" fill="#4ade80"/>
  <line x1="16" y1="18" x2="16" y2="23" stroke="#4ade80" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Right candle (bullish, blue) -->
  <line x1="24" y1="6" x2="24" y2="11" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="21.5" y="11" width="5" height="7" rx="1" fill="#60a5fa"/>
  <line x1="24" y1="18" x2="24" y2="21" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Baseline -->
  <line x1="4" y1="27" x2="28" y2="27" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
</svg>
